[project]
name = "codingpirates-maze"
version = "0.1.0"
description = "Turtle-graphics maze framework and code.org level importer used by Coding Pirates Python puzzles"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

dependencies = []

[project.urls]
Repository = "https://github.com/StefanUG/codingpirates-maze"

# Only needed to run the importer (dev tool, not required by students installing this package)
[dependency-groups]
importer = ["Jinja2"]

[build-system]
requires = ["uv_build>=0.10.12,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["maze", "importer"]
module-root = "src"
